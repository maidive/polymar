<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Polybot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3a;
    --accent: #6366f1;
    --accent-dim: rgba(99,102,241,0.15);
    --green: #22c55e;
    --red: #ef4444;
    --text: #e8e8f0;
    --muted: #6b6b80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  code, .mono { font-family: 'DM Mono', monospace; }

  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px 28px; width: 100%; max-width: 400px;
  }
  .login-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; letter-spacing: .04em; }
  .field input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .85; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; display: none; }
  .btn-metamask {
    width: 100%; background: #f6851b; color: #fff; border: none;
    border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .15s; display: flex; align-items: center;
    justify-content: center; gap: 8px;
  }
  .btn-metamask:hover { opacity: .88; }
  .btn-metamask:disabled { opacity: .4; cursor: not-allowed; }
  .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 12px; margin: 18px 0;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  #bot-screen { display: none; padding: 16px; max-width: 480px; margin: 0 auto; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-top: 8px; }
  .top-bar h1 { font-size: 18px; font-weight: 600; }
  .balance-chip {
    background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 20px;
    padding: 4px 12px; font-size: 13px; color: var(--accent); font-family: 'DM Mono', monospace;
  }
  .logout-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-wrap input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px 10px 36px; color: var(--text); font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }

  .markets-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .market-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; cursor: pointer; transition: border-color .15s;
  }
  .market-card:hover, .market-card.active { border-color: var(--accent); background: var(--surface2); }
  .market-q { font-size: 14px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
  .market-prices { display: flex; gap: 8px; }
  .price-yes { background: rgba(34,197,94,.12); color: var(--green); border-radius: 6px; padding: 3px 10px; font-size: 12px; font-family: 'DM Mono', monospace; }
  .price-no  { background: rgba(239,68,68,.12);  color: var(--red);   border-radius: 6px; padding: 3px 10px; font-size: 12px; font-family: 'DM Mono', monospace; }

  #bet-panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 20px; display: none;
  }
  .bet-title { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .bet-market-name { font-size: 15px; font-weight: 500; margin-bottom: 16px; line-height: 1.4; }
  .yn-buttons { display: flex; gap: 10px; margin-bottom: 14px; }
  .btn-yes, .btn-no {
    flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; border: 2px solid transparent; transition: all .15s;
  }
  .btn-yes { background: rgba(34,197,94,.12); color: var(--green); border-color: rgba(34,197,94,.2); }
  .btn-no  { background: rgba(239,68,68,.12);  color: var(--red);   border-color: rgba(239,68,68,.2); }
  .btn-yes.selected { background: var(--green); color: #fff; border-color: var(--green); }
  .btn-no.selected  { background: var(--red);   color: #fff; border-color: var(--red); }

  .quick-btns { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .quick-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 13px; padding: 5px 12px; cursor: pointer; transition: all .15s;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); }
  .amount-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .amount-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 14px; font-family: 'DM Mono', monospace; outline: none;
    transition: border-color .15s;
  }
  .amount-input:focus { border-color: var(--accent); }
  .btn-bet {
    width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .15s; letter-spacing: .02em;
  }
  .btn-bet.yes { background: var(--green); color: #fff; }
  .btn-bet.no  { background: var(--red);   color: #fff; }
  .btn-bet:disabled { opacity: .4; cursor: not-allowed; }

  .section-label { font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .hist-left { flex: 1; }
  .hist-q { font-size: 13px; color: var(--text); margin-bottom: 3px; }
  .hist-meta { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .hist-badge { font-size: 12px; font-family: 'DM Mono', monospace; padding: 3px 8px; border-radius: 5px; }
  .hist-badge.yes { background: rgba(34,197,94,.15); color: var(--green); }
  .hist-badge.no  { background: rgba(239,68,68,.15);  color: var(--red); }

  .loading { text-align: center; color: var(--muted); padding: 32px; font-size: 14px; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-title">Polybot</div>
    <div class="login-sub">Торговый бот для Polymarket</div>
    <button class="btn-metamask" id="metamask-btn" onclick="loginMetaMask()">🦊 Войти через MetaMask</button>
    <div class="divider">или вручную</div>
    <div class="field"><label>WALLET ADDRESS</label><input id="inp-addr" type="text" placeholder="0x3d1e..."></div>
    <div class="field"><label>API KEY (Relayer)</label><input id="inp-key" type="text" placeholder="019e3d6a-..."></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Войти</button>
    <div class="error-msg" id="login-err"></div>
  </div>
</div>

<div id="bot-screen">
  <div class="top-bar">
    <h1>Polybot</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="balance-chip mono" id="balance-chip">$—</div>
      <button class="logout-btn" onclick="doLogout()">выйти</button>
    </div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Поиск рынков..." oninput="filterMarkets()">
  </div>
  <div id="markets-list" class="markets-list">
    <div class="loading"><span class="spinner"></span>Загрузка рынков...</div>
  </div>
  <div id="bet-panel">
    <div class="bet-title">СТАВКА</div>
    <div class="bet-market-name" id="bet-market-name"></div>
    <div class="yn-buttons">
      <button class="btn-yes" id="btn-yes" onclick="selectSide('YES')">YES <span id="yes-price"></span></button>
      <button class="btn-no"  id="btn-no"  onclick="selectSide('NO')">NO <span id="no-price"></span></button>
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="setAmount(1)">$1</button>
      <button class="quick-btn" onclick="setAmount(5)">$5</button>
      <button class="quick-btn" onclick="setAmount(10)">$10</button>
      <button class="quick-btn" onclick="setAmount(25)">$25</button>
    </div>
    <div class="amount-row">
      <input class="amount-input" id="amount-input" type="number" min="1" placeholder="Сумма $">
    </div>
    <button class="btn-bet" id="btn-bet" onclick="placeBet()" disabled>Выбери YES или NO</button>
  </div>
  <div class="section-label">История</div>
  <div class="history-list" id="history-list"></div>
</div>

<script>
const PROXY = 'https://polymar-nine.vercel.app';
let creds = null;
let allMarkets = [];
let selectedMarket = null;
let selectedSide = null;
let betHistory = [];

function loadCreds() {
  try { const s = localStorage.getItem('poly_creds'); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
function saveCreds(c) { localStorage.setItem('poly_creds', JSON.stringify(c)); }

async function doLogin() {
  const btn = document.getElementById('login-btn');
  document.getElementById('login-err').style.display = 'none';
  const address = document.getElementById('inp-addr').value.trim();
  const apiKey  = document.getElementById('inp-key').value.trim();
  if (!address || !apiKey) { showError('Заполни все поля'); return; }
  if (!address.startsWith('0x') || address.length < 40) { showError('Неверный формат адреса'); return; }
  if (apiKey.length < 8) { showError('Неверный формат API ключа'); return; }
  btn.disabled = true; btn.textContent = 'Проверяю...';
  creds = { address, apiKey };
  saveCreds(creds);
  showBot();
  btn.disabled = false; btn.textContent = 'Войти';
}

async function loginMetaMask() {
  if (!window.ethereum) { showError('MetaMask не найден. Установи расширение.'); return; }
  const btn = document.getElementById('metamask-btn');
  const errReset = () => { btn.disabled = false; btn.innerHTML = '🦊 Войти через MetaMask'; };
  document.getElementById('login-err').style.display = 'none';
  btn.disabled = true; btn.textContent = '🦊 Подключаю...';
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const address  = accounts[0].toLowerCase();
    const timestamp = Math.floor(Date.now() / 1000).toString();
    const nonce = 0;

    const typedData = JSON.stringify({
      domain: { name: 'ClobAuthDomain', version: '1', chainId: '137' },
      types: {
        EIP712Domain: [
          { name: 'name',    type: 'string'  },
          { name: 'version', type: 'string'  },
          { name: 'chainId', type: 'uint256' }
        ],
        ClobAuthMsg: [
          { name: 'address',   type: 'address' },
          { name: 'timestamp', type: 'string'  },
          { name: 'nonce',     type: 'uint256' }
        ]
      },
      primaryType: 'ClobAuthMsg',
      message: { address, timestamp, nonce }
    });

    // Switch to Polygon (chainId 137) — required for CLOB auth
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: '0x89' }]
      });
    } catch (switchErr) {
      if (switchErr.code === 4902) {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: '0x89',
            chainName: 'Polygon Mainnet',
            nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
            rpcUrls: ['https://polygon-rpc.com/'],
            blockExplorerUrls: ['https://polygonscan.com/']
          }]
        });
      } else {
        throw switchErr;
      }
    }

    btn.textContent = '🦊 Подпиши в MetaMask...';
    const signature = await window.ethereum.request({
      method: 'eth_signTypedData_v4',
      params: [address, typedData]
    });

    btn.textContent = '🦊 Получаю ключи...';
    const params = new URLSearchParams({
      path: 'auth/api-key',
      address,
      l1sig: signature,
      l1ts: timestamp,
      l1nonce: nonce.toString()
    });
    const res = await fetch(`${PROXY}/api/proxy?${params}`, { method: 'POST' });
    const keys = await res.json().catch(() => ({}));
    if (!res.ok || !keys.apiKey) throw new Error(keys.error || `HTTP ${res.status}`);

    creds = { address, apiKey: keys.apiKey, secret: keys.secret, passphrase: keys.passphrase };
    saveCreds(creds);
    showBot();
  } catch(e) {
    showError(e.code === 4001 ? 'Отклонено пользователем' : 'Ошибка: ' + e.message);
    errReset();
  }
}

function doLogout() {
  localStorage.removeItem('poly_creds');
  creds = null;
  document.getElementById('bot-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showError(msg) {
  const el = document.getElementById('login-err');
  el.textContent = msg; el.style.display = 'block';
}

async function proxyGet(path, c = creds) {
  const params = new URLSearchParams({ path, apiKey: c.apiKey, address: c.address });
  if (c.secret)     params.set('secret',     c.secret);
  if (c.passphrase) params.set('passphrase', c.passphrase);
  return fetch(`${PROXY}/api/proxy?${params}`);
}

async function proxyPost(path, body, c = creds) {
  return fetch(`${PROXY}/api/proxy?path=${encodeURIComponent(path)}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ _creds: c, ...body })
  });
}

async function hmacBrowser(secret, message) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    'raw', enc.encode(secret),
    { name: 'HMAC', hash: 'SHA-256' },
    false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
  return btoa(String.fromCharCode(...new Uint8Array(sig)));
}

async function directOrder(body) {
  if (creds.secret) {
    // HMAC-signed via proxy (full CLOB auth)
    return proxyPost('order', body);
  }
  // Relayer API fallback (no HMAC needed)
  return fetch('https://clob.polymarket.com/order', {
    method: 'POST',
    headers: {
      'Content-Type':           'application/json',
      'RELAYER_API_KEY':         creds.apiKey,
      'RELAYER_API_KEY_ADDRESS': creds.address,
    },
    body: JSON.stringify(body)
  });
}

async function showBot() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('bot-screen').style.display = 'block';
  loadHistory(); loadBalance(); loadMarkets();
}

async function loadBalance() {
  try {
    if (creds.secret) {
      // Authenticated CLOB balance (real USDC cash)
      const res = await proxyGet('balance');
      if (!res.ok) return;
      const d = await res.json();
      const amt = d.balance ?? d.USDC ?? d.value ?? 0;
      document.getElementById('balance-chip').textContent = '$' + parseFloat(amt).toFixed(2);
    } else {
      // Portfolio positions value via data-api (may show 0 for empty positions)
      const path = encodeURIComponent('value?user=' + creds.address);
      const res = await fetch(`${PROXY}/api/proxy?path=${path}&api=data`);
      if (!res.ok) return;
      const d = await res.json();
      const amt = Array.isArray(d) ? (d[0]?.value ?? 0) : (d?.value ?? 0);
      document.getElementById('balance-chip').textContent = '$' + parseFloat(amt).toFixed(2);
    }
  } catch(e) {}
}

async function loadMarkets() {
  try {
    const res = await fetch(`${PROXY}/api/markets`);
    const data = await res.json();
    allMarkets = data.data || data.results || (Array.isArray(data) ? data : []);
    renderMarkets(allMarkets);
  } catch(e) {
    document.getElementById('markets-list').innerHTML = '<div class="loading" style="color:var(--red)">Ошибка загрузки рынков</div>';
  }
}

function renderMarkets(list, isSearch = false) {
  const el = document.getElementById('markets-list');
  if (!list.length) { el.innerHTML = '<div class="loading">Рынки не найдены</div>'; return; }
  const shown = isSearch ? list : list.slice(0, 50);
  el.innerHTML = shown.map(m => {
    const tokens = m.tokens || [];
    const yes = tokens.find(t => t.outcome === 'Yes') || tokens[0] || {};
    const no  = tokens.find(t => t.outcome === 'No')  || tokens[1] || {};
    return `<div class="market-card" onclick="selectMarket('${m.condition_id}', this)">
      <div class="market-q">${m.question}</div>
      <div class="market-prices">
        <span class="price-yes">YES ${yes.price != null ? (yes.price*100).toFixed(0)+'¢' : '—'}</span>
        <span class="price-no">NO ${no.price != null ? (no.price*100).toFixed(0)+'¢' : '—'}</span>
      </div>
    </div>`;
  }).join('');
}

function filterMarkets() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if (!q) { renderMarkets(allMarkets); return; }
  renderMarkets(allMarkets.filter(m => m.question.toLowerCase().includes(q)), true);
}

function selectMarket(condId, el) {
  document.querySelectorAll('.market-card').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedMarket = allMarkets.find(m => m.condition_id === condId);
  selectedSide = null;
  const tokens = selectedMarket.tokens || [];
  const yes = tokens.find(t => t.outcome === 'Yes') || tokens[0] || {};
  const no  = tokens.find(t => t.outcome === 'No')  || tokens[1] || {};
  document.getElementById('bet-market-name').textContent = selectedMarket.question;
  document.getElementById('yes-price').textContent = yes.price != null ? (yes.price*100).toFixed(0)+'¢' : '';
  document.getElementById('no-price').textContent  = no.price  != null ? (no.price*100).toFixed(0)+'¢' : '';
  document.getElementById('btn-yes').classList.remove('selected');
  document.getElementById('btn-no').classList.remove('selected');
  document.getElementById('btn-bet').disabled = true;
  document.getElementById('btn-bet').textContent = 'Выбери YES или NO';
  document.getElementById('btn-bet').className = 'btn-bet';
  document.getElementById('bet-panel').style.display = 'block';
  document.getElementById('bet-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function selectSide(side) {
  selectedSide = side;
  document.getElementById('btn-yes').classList.toggle('selected', side === 'YES');
  document.getElementById('btn-no').classList.toggle('selected', side === 'NO');
  const btn = document.getElementById('btn-bet');
  btn.disabled = false;
  btn.textContent = `Поставить ${side}`;
  btn.className = 'btn-bet ' + side.toLowerCase();
}

function setAmount(v) { document.getElementById('amount-input').value = v; }

async function placeBet() {
  if (!selectedMarket || !selectedSide) return;
  const amount = parseFloat(document.getElementById('amount-input').value);
  if (!amount || amount <= 0) { alert('Введи сумму'); return; }
  const btn = document.getElementById('btn-bet');
  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = 'Отправляю...';
  const t0 = Date.now();
  try {
    const tokens  = selectedMarket.tokens || [];
    const token   = tokens.find(t => t.outcome === (selectedSide === 'YES' ? 'Yes' : 'No')) || (selectedSide === 'YES' ? tokens[0] : tokens[1]) || {};
    const price   = token.price || 0.5;
    const tokenId = token.token_id;
    const size    = (amount / price).toFixed(2);
    const orderBody = {
      order: {
        tokenId,
        price,
        size: parseFloat(size),
        side: 'BUY',
        type: 'MARKET',
        timeInForce: 'FOK'
      }
    };
    const res = await directOrder(orderBody);
    const ms = Date.now() - t0;
    const data = await res.json();
    if (res.ok && !data.error) {
      addHistory(selectedMarket.question, selectedSide, amount, ms, 'ok');
      loadBalance();
      btn.textContent = `✓ Принято (${ms}ms)`;
      setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 2000);
    } else {
      addHistory(selectedMarket.question, selectedSide, amount, ms, 'err');
      btn.textContent = `✗ ${data.error || 'Ошибка'}`;
      setTimeout(() => { btn.disabled = false; btn.textContent = origText; }, 3000);
    }
  } catch(e) {
    btn.textContent = '✗ Сеть';
    btn.disabled = false;
  }
}

function addHistory(question, side, amount, ms, status) {
  betHistory.unshift({ question, side, amount, ms, status, time: new Date().toLocaleTimeString() });
  localStorage.setItem('poly_history', JSON.stringify(betHistory.slice(0, 50)));
  renderHistory();
}

function loadHistory() {
  try { betHistory = JSON.parse(localStorage.getItem('poly_history') || '[]'); } catch(e) { betHistory = []; }
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!betHistory.length) { el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0">Пока пусто</div>'; return; }
  el.innerHTML = betHistory.slice(0, 20).map(h =>
    `<div class="hist-item">
      <div class="hist-left">
        <div class="hist-q">${h.question.slice(0,60)}${h.question.length>60?'…':''}</div>
        <div class="hist-meta">${h.time} · $${h.amount} · ${h.ms}ms · ${h.status === 'ok' ? '✓' : '✗'}</div>
      </div>
      <span class="hist-badge ${h.side.toLowerCase()}">${h.side}</span>
    </div>`
  ).join('');
}

(function init() {
  const saved = loadCreds();
  if (saved) {
    creds = saved;
    document.getElementById('inp-addr').value = saved.address || '';
    document.getElementById('inp-key').value  = saved.apiKey  || '';
    showBot();
  }
})();
</script>
